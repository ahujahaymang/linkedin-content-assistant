profile_id: "example-tech-lead"
name: "Tech Lead Profile"
description: "Leadership-focused profile for tech leads sharing insights on team building, technical strategy, and engineering culture"
version: 1
enabled: true
created_at: "2024-01-15T10:00:00"
last_updated: "2024-01-15T10:00:00"

identity:
